<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>see mah projects</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.js"></script>
</head>

<body>

<canvas id="code-bg" aria-hidden="true"></canvas>
<canvas id="ascii-flow" aria-hidden="true"></canvas>
<div id="bg-glow" aria-hidden="true"></div>

<h1>My Projects</h1>

<div class="term">
    <div class="term-bar">
        <span class="dot r"></span>
        <span class="dot y"></span>
        <span class="dot g"></span>
        <span class="term-title">dipdagod@projects:~</span>
    </div>

    <div class="term-body">
        <div class="prompt-line">
            <span class="prompt-user">dipdagod@projects</span><span class="prompt-punct">:</span><span class="prompt-path">~</span><span class="prompt-punct">$</span>
            <span class="prompt-cmd">git ls-repos</span>
        </div>
        <p id="subtitle">checking cache...</p>

        <div class="controls">
            <div class="filter-wrap">
                <span class="filter-prefix">grep -i</span>
                <input id="filter" placeholder="filter repos... ( / )">
                <button id="filter-clear" aria-label="Clear filter" type="button">✕</button>
            </div>
            <select id="sort" aria-label="Sort repositories">
                <option value="updated">recently updated</option>
                <option value="stars">most stars</option>
                <option value="name">name</option>
            </select>
            <button id="refresh"><span class="icon">⟳</span><span class="label">pull</span></button>
        </div>
    </div>
</div>

<div id="stats-bar"></div>
<div id="lang-bar" aria-hidden="true"></div>
<div id="lang-chips"></div>

<div id="grid"></div>

<div id="status-row">
    <div id="status"></div>
    <div id="uptime"></div>
    <button id="help-toggle" type="button" aria-label="Keyboard shortcuts">? help</button>
</div>

<div id="help-panel" hidden>
    <div class="help-title">$ man shortcuts</div>
    <div class="help-row"><kbd>/</kbd><span>focus filter</span></div>
    <div class="help-row"><kbd>Esc</kbd><span>clear filter / close this</span></div>
    <div class="help-row"><kbd>?</kbd><span>toggle this panel</span></div>
    <div class="help-row"><kbd>↻ pull</kbd><span>fetch latest repos</span></div>
</div>

<script src="script.js"></script>

</body>
</html>
