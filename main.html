<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dipdagod — projects</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
    --bg:#0a0c10;
    --term:#10141b;
    --card:#131826;
    --border:#212836;
    --border-hi:#2c3546;
    --text:#dbe1ea;
    --muted:#6b7280;
    --muted-dim:#454b57;
    --green:#3fb950;
    --purple:#bc8cff;
    --yellow:#d29922;
    --red:#f85149;

    --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans:"Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

*{ box-sizing:border-box; }

html{ scrollbar-color: var(--border-hi) var(--bg); }

body{
    margin:0;
    padding:48px 20px 60px;
    background:
        radial-gradient(ellipse 900px 500px at 50% -10%, rgba(63,185,80,.06), transparent 60%),
        var(--bg);
    color:var(--text);
    font-family:var(--sans);
}

a{ color:inherit; }

/* ---------- terminal window ---------- */
.term{
    max-width:1000px;
    margin:0 auto 34px;
    background:var(--term);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 30px 60px -30px rgba(0,0,0,.6);
}

.term-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 14px;
    background:#0d1119;
    border-bottom:1px solid var(--border);
}

.dot{ width:11px; height:11px; border-radius:50%; opacity:.85; }
.dot.r{ background:#ff5f56; }
.dot.y{ background:#ffbd2e; }
.dot.g{ background:#27c93f; }

.term-title{
    margin:0 auto;
    transform:translateX(-16px);
    font-family:var(--mono);
    font-size:.78rem;
    color:var(--muted);
    letter-spacing:.02em;
}

.term-body{
    padding:22px 26px 20px;
}

.prompt-line{
    font-family:var(--mono);
    font-size:.92rem;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:baseline;
}

.prompt-sym{ color:var(--green); font-weight:700; }
.prompt-path{ color:var(--purple); }
.prompt-cmd{ color:var(--text); }

#subtitle{
    font-family:var(--mono);
    font-size:.85rem;
    color:var(--muted);
    margin:9px 0 0;
    padding-left:24px;
}

#subtitle::after{
    content:"▌";
    color:var(--green);
    margin-left:3px;
    animation:blink 1.1s steps(1) infinite;
}

@media (prefers-reduced-motion: reduce){
    #subtitle::after{ animation:none; }
}

@keyframes blink{ 50%{ opacity:0; } }

h1{ display:none; } /* replaced by terminal title */

/* ---------- controls ---------- */
.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
    padding-left:24px;
}

.filter-wrap{
    display:flex;
    align-items:center;
    flex:1 1 260px;
    background:#0d1119;
    border:1px solid var(--border);
    border-radius:7px;
    padding:0 12px;
    transition:border-color .15s;
}

.filter-wrap:focus-within{
    border-color:var(--green);
}

.filter-prefix{
    font-family:var(--mono);
    font-size:.82rem;
    color:var(--muted-dim);
    white-space:nowrap;
}

#filter{
    flex:1;
    padding:10px 8px;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:.88rem;
    outline:none;
}

#filter::placeholder{ color:var(--muted-dim); }

#refresh{
    padding:10px 16px;
    border:1px solid var(--border);
    border-radius:7px;
    cursor:pointer;
    background:#0d1119;
    color:var(--green);
    font-family:var(--mono);
    font-weight:500;
    font-size:.85rem;
    transition:.15s;
}

#refresh:hover{
    border-color:var(--green);
    background:rgba(63,185,80,.08);
}

#refresh:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* ---------- grid ---------- */
#grid{
    max-width:1000px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:14px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-left:2px solid var(--border-hi);
    border-radius:8px;
    padding:16px 17px;
    display:flex;
    flex-direction:column;
    gap:9px;
    transition:border-color .15s, transform .15s, box-shadow .15s;
}

.card:hover{
    transform:translateY(-3px);
    border-left-color:var(--purple);
    border-color:var(--border-hi);
    box-shadow:0 14px 28px -18px rgba(0,0,0,.55);
}

@media (prefers-reduced-motion: reduce){
    .card{ transition:border-color .15s; }
    .card:hover{ transform:none; }
}

.name-row{
    display:flex;
    align-items:center;
    gap:7px;
}

.branch-icon{ color:var(--muted-dim); font-size:.85rem; flex-shrink:0; }

.name{
    color:var(--purple);
    font-family:var(--mono);
    font-size:1rem;
    font-weight:700;
    text-decoration:none;
    word-break:break-word;
}

.name:hover{ text-decoration:underline; }

.desc{
    color:var(--muted);
    min-height:38px;
    font-size:.88rem;
    line-height:1.45;
}

.site-link{
    display:inline-flex;
    width:fit-content;
    align-items:center;
    gap:6px;
    padding:5px 10px;
    border-radius:5px;
    text-decoration:none;
    font-family:var(--mono);
    font-size:.78rem;
    color:var(--green);
    background:rgba(63,185,80,.08);
    border:1px solid rgba(63,185,80,.3);
}

.site-link:hover{ background:rgba(63,185,80,.16); }

.meta{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    align-items:center;
    margin-top:auto;
    padding-top:8px;
    border-top:1px solid var(--border);
    color:var(--muted);
    font-family:var(--mono);
    font-size:.76rem;
}

.lang-dot{
    width:8px;
    height:8px;
    display:inline-block;
    border-radius:50%;
    margin-right:5px;
}

.meta span{ display:inline-flex; align-items:center; }

/* ---------- empty / error ---------- */
.card.notice{
    grid-column:1 / -1;
    border-left-color:var(--red);
    font-family:var(--mono);
}

.card.notice strong{
    color:var(--red);
    font-size:.88rem;
}

.card.notice span{
    color:var(--muted);
    font-size:.82rem;
}

.empty{
    grid-column:1 / -1;
    text-align:center;
    padding:30px 10px;
    color:var(--muted-dim);
    font-family:var(--mono);
    font-size:.85rem;
}

/* ---------- footer status ---------- */
#status{
    max-width:1000px;
    margin:24px auto 0;
    color:var(--muted-dim);
    font-family:var(--mono);
    font-size:.76rem;
}

#status::before{ content:"// "; }
</style>
</head>

<body>

<h1>My Projects</h1>

<div class="term">
    <div class="term-bar">
        <span class="dot r"></span>
        <span class="dot y"></span>
        <span class="dot g"></span>
        <span class="term-title">dipdagod — projects — zsh</span>
    </div>

    <div class="term-body">
        <div class="prompt-line">
            <span class="prompt-sym">➜</span>
            <span class="prompt-path">~/projects</span>
            <span class="prompt-cmd">git ls-repos</span>
        </div>
        <p id="subtitle">Loading repositories...</p>

        <div class="controls">
            <div class="filter-wrap">
                <span class="filter-prefix">grep -i</span>
                <input id="filter" placeholder="filter repos...">
            </div>
            <button id="refresh">⟳ pull</button>
        </div>
    </div>
</div>

<div id="grid"></div>

<div id="status"></div>

<script>
const USERNAME = "dipdagod";

const EXCLUDE = [
    "dipdagod.github.io",
    "projects-showcase",
    "Wisdom-Woods",
    "DipDaGod",
];

const SORT_BY_STARS = false;

const CACHE_KEY = "github_repo_cache";
const CACHE_TIME = 10 * 60 * 1000; // 10 minutes

const grid = document.getElementById("grid");
const subtitle = document.getElementById("subtitle");
const status = document.getElementById("status");
const refreshBtn = document.getElementById("refresh");

let allRepos = [];

// -------------------------
// Language colors (subset of GitHub's linguist palette)
// -------------------------
const LANG_COLORS = {
    JavaScript:"#f1e05a", TypeScript:"#3178c6", Python:"#3572A5",
    HTML:"#e34c26", CSS:"#563d7c", Shell:"#89e051", Java:"#b07219",
    "C++":"#f34b7d", C:"#555555", "C#":"#178600", Go:"#00ADD8",
    Rust:"#dea584", PHP:"#4F5D95", Ruby:"#701516", Swift:"#F05138",
    Kotlin:"#A97BFF", Dart:"#00B4AB", Vue:"#41b883", Jupyter:"#DA5B0B"
};

function langColor(lang){
    return LANG_COLORS[lang] || "#8b949e";
}

// -------------------------
// Fetch repositories
// -------------------------
async function fetchRepos(force = false){

    // Try cache first
    if(!force){
        const cache = JSON.parse(localStorage.getItem(CACHE_KEY));

        if(cache && (Date.now() - cache.time) < CACHE_TIME){

            allRepos = cache.data;

            render(allRepos);

            subtitle.textContent =
                `${allRepos.length} public repositories · cached`;

            status.textContent =
                `last synced ${new Date(cache.time).toLocaleString()}`;

            return;
        }
    }

    refreshBtn.disabled = true;
    refreshBtn.textContent = "pulling...";

    try{

        const response = await fetch(
            `https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`
        );

        if(!response.ok){
            throw new Error(`GitHub API Error ${response.status}`);
        }

        let repos = await response.json();

        repos = repos.filter(repo =>
            !repo.fork &&
            !EXCLUDE.includes(repo.name)
        );

        if(SORT_BY_STARS){
            repos.sort((a,b)=>b.stargazers_count-a.stargazers_count);
        }

        allRepos = repos;

        render(allRepos);

        localStorage.setItem(
            CACHE_KEY,
            JSON.stringify({
                time: Date.now(),
                data: repos
            })
        );

        subtitle.textContent =
            `${repos.length} public repositories · live`;

        status.textContent =
            `last synced ${new Date().toLocaleString()}`;

    }
    catch(err){

        console.error(err);

        subtitle.textContent = "fatal: couldn't reach api.github.com";

        status.textContent = err.message;

        grid.innerHTML = `
            <div class="card notice">
                <strong>✗ Failed to load repositories</strong>
                <span>${escapeHtml(err.message)}</span>
            </div>
        `;
    }

    refreshBtn.disabled = false;
    refreshBtn.textContent = "⟳ pull";
}

// -------------------------
// Render
// -------------------------
function render(repos){

    if(repos.length === 0){
        grid.innerHTML = `<div class="empty">no matches</div>`;
        return;
    }

    grid.innerHTML = repos.map(repo => `
        <div class="card">

            <div class="name-row">
                <span class="branch-icon">⌥</span>
                <a
                    class="name"
                    href="${repo.html_url}"
                    target="_blank"
                >
                    ${escapeHtml(repo.name)}
                </a>
            </div>

            <div class="desc">
                ${repo.description
                    ? escapeHtml(repo.description)
                    : "No description."}
            </div>

            ${
                repo.homepage
                    ? `
                    <a
                        class="site-link"
                        href="${repo.homepage}"
                        target="_blank"
                    >
                        🔗 visit site
                    </a>
                    `
                    : ""
            }

            <div class="meta">

                ${
                    repo.language
                        ? `
                        <span>
                            <span class="lang-dot" style="background:${langColor(repo.language)}"></span>
                            ${escapeHtml(repo.language)}
                        </span>
                        `
                        : ""
                }

                <span>★ ${repo.stargazers_count}</span>

                <span>
                    ${new Date(repo.pushed_at).toLocaleDateString()}
                </span>

            </div>

        </div>
    `).join("");

}

// -------------------------
// Escape HTML
// -------------------------
function escapeHtml(str){

    return String(str).replace(/[&<>"']/g, m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        "\"":"&quot;",
        "'":"&#39;"
    })[m]);

}

// -------------------------
// Filter
// -------------------------
document.getElementById("filter").addEventListener("input", e => {

    const q = e.target.value.toLowerCase();

    render(
        allRepos.filter(repo =>
            repo.name.toLowerCase().includes(q)
        )
    );

});

// -------------------------
// Refresh button
// -------------------------
refreshBtn.addEventListener("click", () => {
    fetchRepos(true);
});

// -------------------------
// Initial load
// -------------------------
fetchRepos();

// -------------------------
// Auto refresh every 10 mins
// -------------------------
setInterval(() => {
    fetchRepos(true);
}, CACHE_TIME);

</script>

</body>
</html>
