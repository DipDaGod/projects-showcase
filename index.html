<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dipdagod — projects</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>My Projects</h1>

<div class="term">
    <div class="term-bar">
        <span class="dot r"></span>
        <span class="dot y"></span>
        <span class="dot g"></span>
        <span class="term-title">dipdagod — projects — zsh</span>
    </div>

    <div class="term-body">
        <div class="prompt-line">
            <span class="prompt-sym">➜</span>
            <span class="prompt-path">~/projects</span>
            <span class="prompt-cmd">git ls-repos</span>
        </div>
        <p id="subtitle">checking cache...</p>

        <div class="controls">
            <div class="filter-wrap">
                <span class="filter-prefix">grep -i</span>
                <input id="filter" placeholder="filter repos... ( / )">
                <button id="filter-clear" aria-label="Clear filter" type="button">✕</button>
            </div>
            <button id="refresh"><span class="icon">⟳</span><span class="label">pull</span></button>
        </div>
    </div>
</div>

<div id="grid"></div>

<div id="status"></div>

<script src="script.js"></script>

</body>
</html>
